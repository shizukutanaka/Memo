name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    # Python 3.8 is outside the supported range (pyproject
    # requires-python >=3.9) and is no longer published for current
    # runner images, so it is not in the matrix. The 3.9 leg stays, on
    # ubuntu-22.04, because ubuntu-latest (Ubuntu 26.04) no longer
    # provides 3.9; the macos/windows 3.9 legs are unaffected.
    runs-on: ${{ matrix.python-version == '3.9' && matrix.os == 'ubuntu-latest' && 'ubuntu-22.04' || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run tests with pytest
      # Coverage source and the fail-under floor live in pytest.ini
      # (scoped to memo.py, the module this suite verifies). Passing
      # --cov=. here would override that scope and fail the gate on
      # whole-repository coverage instead.
      run: |
        pytest tests/ --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit pip-audit

    # The JSON report keeps the whole-tree Bandit picture visible
    # (advisory; it includes unshipped legacy modules). The gate below
    # enforces the modules that actually ship (the py-modules list in
    # pyproject.toml), which are clean at -ll.
    - name: Run Bandit security scan
      run: |
        bandit -r . -f json -o bandit-report.json || true
        bandit memo.py memo_api.py config.py memo_enhanced_utils.py memo_errors.py memo_integrity.py memo_performance.py memo_security.py -ll -f txt

    # Replaces Safety: Safety 3.x requires an account/API key and its
    # `check` command errors out (exit 64), so it never audited
    # anything. pip-audit audits the declared requirements and fails on
    # known vulnerabilities.
    - name: Audit dependencies with pip-audit
      run: |
        pip-audit -r requirements.txt -r requirements-dev.txt --desc

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy

    - name: Run flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

    # Black/isort scope matches the quality gate in ci.yml (and
    # [tool.black] / [tool.isort] in pyproject.toml). The previous
    # whole-tree checks covered 40+ unshipped legacy modules that were
    # never formatted, so they could only ever fail.
    - name: Check formatting with black
      run: |
        black --check memo.py memo_tui.py cloud_sync.py --line-length=100

    - name: Check import sorting with isort
      run: |
        isort --check-only memo.py memo_tui.py cloud_sync.py

    # Advisory, same treatment as ci.yml: reports the pre-existing
    # type debt in memo.py without blocking the pipeline.
    - name: Run mypy type checking
      run: |
        mypy memo.py --ignore-missing-imports || true
