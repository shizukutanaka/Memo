name: CI/CD Pipeline

# This is the single canonical workflow. ci-cd.yml and tests.yml were
# removed after verifying that every gate they ran is covered here at
# equal or wider scope:
# - Test matrix: 3 OS x Python 3.9-3.13 (theirs: ubuntu-only 3.9-3.11
#   and 3 OS x 3.9-3.12), running the full suite (tests/ plus the root
#   suites; tests.yml ran tests/ only).
# - Quality and security gates: identical checks (flake8 / black /
#   isort / advisory mypy, Bandit -ll on the shipped modules,
#   pip-audit), plus the build job, which only ever existed here.
# Elements unique to the removed files were migrated, not dropped:
# the `release` trigger came from ci-cd.yml, and the advisory
# whole-tree Bandit JSON report in the security job came from
# tests.yml. ci-cd.yml's sqlite3 CLI install step was not migrated:
# this workflow's test job passes on every leg without it (the
# sqlite3 module is part of Python's standard library).

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]
  release:
    types: [published]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    # Python 3.9 is in the supported range (pyproject requires-python
    # >=3.9) but is no longer published for the Ubuntu 26.04 image behind
    # ubuntu-latest, so the 3.9 leg runs on ubuntu-22.04 instead. The
    # windows/macos 3.9 legs are unaffected and stay on *-latest.
    runs-on: ${{ matrix.python-version == '3.9' && matrix.os == 'ubuntu-latest' && 'ubuntu-22.04' || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e .
        pip install pytest pytest-cov pytest-asyncio

    - name: Run tests with coverage
      # Run the full suite (tests/ plus the root suites) under the
      # pytest.ini configuration. Coverage scope and the fail-under
      # floor live in pytest.ini, scoped to memo.py; passing --cov=.
      # here overrode that scope and failed the gate on
      # whole-repository coverage (14.55% < 20%) even with every test
      # passing, and the root suites alone leave memo.py at 15.3%,
      # also below the floor. This step is a real gate: no
      # continue-on-error, so a failing suite fails the job.
      run: |
        pytest tests/ test_memo_core_suite.py test_memo_system.py test_search_fts.py -v --tb=short --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      with:
        files: ./coverage.xml
        flags: unittests
        fail_ci_if_error: false

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy

    # These steps are real gates (no continue-on-error): each one passes
    # on the current tree. Black/isort scope and line length match
    # [tool.black] / [tool.isort] in pyproject.toml.
    - name: Lint with flake8
      run: |
        # Stop build on syntax errors and undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-line-length=120 --statistics

    - name: Check code format with Black
      run: black --check memo.py memo_tui.py cloud_sync.py --line-length=100

    - name: Check import sorting with isort
      run: isort --check-only memo.py memo_tui.py cloud_sync.py

    # mypy is a hard gate: the invocation must stay valid (the old
    # --exit-zero flag was not a mypy flag, so the step died with a
    # usage error and never type-checked anything) and the error
    # count must stay at zero. The last error was a real bug, not a
    # typing nit: MemoStore.corrupted_file was never assigned, so the
    # quarantine path raised AttributeError at runtime; it is now
    # initialized in __init__ and covered by a regression test.
    - name: Type check with mypy
      run: mypy memo.py --ignore-missing-imports

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit pip-audit

    # Advisory whole-tree report (migrated from tests.yml when the
    # workflows were consolidated): keeps the findings in unshipped
    # legacy modules visible in the job log without gating on them.
    # The gate is the shipped-modules scan below.
    - name: Bandit whole-tree report (advisory)
      run: bandit -r . -f json -o bandit-report.json || true

    # Bandit is a real gate over the modules that actually ship (the
    # py-modules list in pyproject.toml). The previous whole-tree scan
    # reported 100+ findings in unshipped legacy modules and could only
    # ever run with --exit-zero, i.e. it measured nothing; the shipped
    # set is clean at -ll and is enforced here.
    - name: Security check with Bandit
      run: bandit memo.py memo_api.py config.py memo_enhanced_utils.py memo_errors.py memo_integrity.py memo_performance.py memo_security.py -ll

    # Safety 3.x requires an account/API key and its `check` command
    # errors out (exit 64), so that gate also measured nothing.
    # pip-audit audits the declared requirements directly and is a real
    # gate: it fails if a pinned/floored dependency has a known
    # vulnerability.
    - name: Audit dependencies with pip-audit
      run: pip-audit -r requirements.txt -r requirements-dev.txt

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [test, code-quality]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build distribution
      run: python -m build

    - name: Check distribution
      run: twine check dist/*
      continue-on-error: true
