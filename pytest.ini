[pytest]
# Pytest configuration file

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Minimum Python version
minversion = 7.0

# Command line options applied by default
addopts =
    # Verbose output
    -v
    # Show extra test summary info
    -ra
    # Show local variables in tracebacks
    -l
    # Strict markers
    --strict-markers
    # Strict config
    --strict-config
    # Coverage options
    # Scoped to memo.py, the module the tests/ suite verifies. The previous
    # setting measured the whole repository (--cov=.) against a 70% floor:
    # with ~40 unrelated modules in the source tree and a suite that
    # collected zero tests, that gate could only ever fail, so it measured
    # nothing. The floor below is a ratchet set just under the measured
    # coverage of memo.py (21% when this was repaired); raise it as the
    # suite grows, do not lower it to make a run pass.
    --cov=memo
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    # Fail if coverage of memo.py falls below 20%
    --cov-fail-under=20
    # Show warnings
    -W default

# Markers for organizing tests
markers =
    unit: Unit tests
    integration: Integration tests
    security: Security-related tests
    performance: Performance and load tests
    smoke: Quick smoke tests
    slow: Tests that take a long time to run

# Coverage configuration
[coverage:run]
source = .
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */env/*
    setup.py
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    # Default exclusions
    pragma: no cover
    def __repr__
    def __str__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstract
    @abstractmethod

[coverage:html]
directory = htmlcov
